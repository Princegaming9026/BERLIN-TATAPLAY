<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Player</title>
    <link rel="shortcut icon" href="https://i.postimg.cc/YC3Npf10/image.webp">
    <link rel="stylesheet" href="Player.css">
    
    <style>
        /* Background Styling */
        body {
            margin: 0;
            background: radial-gradient(circle, #1a1a1a, #000000);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        /* Loading Screen */
        .loading {
            position: fixed;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            color: red;
            z-index: 999;
        }

        /* Stylish Animation */
        @keyframes blink {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
        .loading span {
            display: inline-block;
            animation: blink 1s infinite alternate;
        }
        .loading span:nth-child(1) { animation-delay: 0s; }
        .loading span:nth-child(2) { animation-delay: 0.2s; }
        .loading span:nth-child(3) { animation-delay: 0.4s; }
        .loading span:nth-child(4) { animation-delay: 0.6s; }
        .loading span:nth-child(5) { animation-delay: 0.8s; }

        /* Player Container */
        #jwplayerDiv {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jwplayer.com/libraries/SAHhwvZq.js"></script>

    <!-- Loading Animation -->
    <div id="loading" class="loading">
        <span>L</span><span>O</span><span>A</span><span>D</span><span>I</span><span>N</span><span>G</span>
    </div>

    <div id="jwplayerDiv"></div>

    <script>
        function playMedia() {
            const queryParams = new URLSearchParams(window.location.search);
            const m3u8Link = queryParams.get('m3u8') || "http://link.luckonline.eu/live/0c:89:10:e8:1c:d4/869/505.m3u8"; // Default stream link

            const playerInstance = jwplayer('jwplayerDiv').setup({
                file: m3u8Link,
                type: "hls",
                autostart: true,
                preload: "auto",
                repeat: true,
                mute: false,
                stretching: "exactfit",
                width: "100%",
                height: "100vh",
                cast: {},
                setPip: true,
                skin: {
                    name: "Denver",
                    active: "#FF0000",
                    inactive: "#FFFFFF",
                    background: "#000000"
                }
            });

            playerInstance.on('ready', function () {
                playerInstance.setFullscreen(true);
            });
        }

        // Hide loading screen after 3 seconds
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            playMedia();
        }, 3000);
    </script>
</body>
</html>
