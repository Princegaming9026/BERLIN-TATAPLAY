<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Player</title>
    <link rel="shortcut icon" href="https://i.postimg.cc/YC3Npf10/image.webp">
    
    <style>
        /* Background Styling */
        body {
            margin: 0;
            background: #000000; /* Pure Black */
            color: white;
            font-family: "Poppins", sans-serif;
            text-align: center;
            overflow: hidden;
        }

        /* Loading Screen */
        .loading {
            position: fixed;
            width: 100%;
            height: 100%;
            background: #000000; /* Pure Black */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem; /* 25% Smaller */
            font-weight: bold;
            z-index: 999;
        }

        /* Stylish Blurry Text Animation */
        @keyframes blurText {
            0%, 100% { 
                filter: blur(0px);
                text-shadow: 0 0 10px rgba(128, 0, 255, 0.8);
                transform: scale(1);
            }
            50% { 
                filter: blur(3px);
                text-shadow: 0 0 20px rgba(128, 0, 255, 1);
                transform: scale(1.1);
            }
        }
        
        .loading span {
            display: inline-block;
            color: #9C27B0; /* Purple Neon */
            font-size: 3.5rem; /* 25% Smaller */
            font-weight: 900;
            letter-spacing: 12px;
            text-transform: uppercase;
            animation: blurText 1.5s infinite alternate;
        }
        .loading span:nth-child(1) { animation-delay: 0s; }
        .loading span:nth-child(2) { animation-delay: 0.3s; }
        .loading span:nth-child(3) { animation-delay: 0.6s; }
        .loading span:nth-child(4) { animation-delay: 0.9s; }
        .loading span:nth-child(5) { animation-delay: 1.2s; }
        .loading span:nth-child(6) { animation-delay: 1.5s; }

        /* Player Container */
        #videoContainer {
            width: 100%;
            height: 100vh;
            display: none; /* Hide player initially */
        }
        video {
            width: 100%;
            height: 100%;
            background: black;
        }
    </style>
</head>

<body>

    <!-- Stylish Blurry Loading Animation -->
    <div id="loading" class="loading">
        <span>M</span><span>A</span><span>D</span><span>A</span><span>R</span><span>A</span>
    </div>

    <div id="videoContainer">
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        function playMedia() {
            const m3u8Link = "https://jcevents.jiocinema.com/bpk-tv/JC_Sports18_1HD/JCHLS/hdntl=exp=1740378932~acl=%2F*~id=aaf549ec51984c86b32dd7de3e1334c7~data=hdntl~hmac=6029ae6ff841ccbb41d820a46f0a255ad02a678707e7c6ad9a63bd546d3ee24d/JC_Sports18_1HD-audio_108038_eng=108000-video=2297600.m3u8";

            const video = document.getElementById('videoPlayer');

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(m3u8Link);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = m3u8Link;
                video.play();
            }
        }

        // Hide loading and show video after 3 sec
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('videoContainer').style.display = 'block';
            playMedia();
        }, 3000);
    </script>
</body>
</html>
