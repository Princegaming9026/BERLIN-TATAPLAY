<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Player</title>
    <link rel="shortcut icon" href="https://i.postimg.cc/YC3Npf10/image.webp">
    
    <style>
        /* Background Styling */
        body {
            margin: 0;
            background: radial-gradient(circle, #1a1a1a, #000000);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        /* Loading Screen */
        .loading {
            position: fixed;
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            z-index: 999;
        }

        /* Blurry Text Animation (Small Area Only) */
        @keyframes blurText {
            0%, 100% { 
                filter: blur(0px);
                text-shadow: 0 0 10px rgba(128, 0, 255, 0.7);
            }
            50% { 
                filter: blur(5px);
                text-shadow: 0 0 20px rgba(128, 0, 255, 1);
            }
        }
        
        .loading span {
            display: inline-block;
            color: #8000ff; /* Purple Neon */
            animation: blurText 1.2s infinite alternate;
        }
        .loading span:nth-child(1) { animation-delay: 0s; }
        .loading span:nth-child(2) { animation-delay: 0.2s; }
        .loading span:nth-child(3) { animation-delay: 0.4s; }
        .loading span:nth-child(4) { animation-delay: 0.6s; }
        .loading span:nth-child(5) { animation-delay: 0.8s; }
        .loading span:nth-child(6) { animation-delay: 1s; }

        /* Player Container */
        #videoContainer {
            width: 100%;
            height: 100vh;
            display: none; /* Hide player initially */
        }
        video {
            width: 100%;
            height: 100%;
            background: black;
        }
    </style>
</head>

<body>

    <!-- Blurry Text Animation -->
    <div id="loading" class="loading">
        <span>M</span><span>A</span><span>D</span><span>A</span><span>R</span><span>A</span>
    </div>

    <div id="videoContainer">
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        function playMedia() {
            const queryParams = new URLSearchParams(window.location.search);
            const m3u8Link = queryParams.get('m3u8') || "http://link.luckonline.eu/live/0c:89:10:e8:1c:d4/869/505.m3u8"; // Default stream link

            const video = document.getElementById('videoPlayer');

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(m3u8Link);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = m3u8Link;
                video.play();
            }
        }

        // Hide loading and show video after 3 sec
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('videoContainer').style.display = 'block';
            playMedia();
        }, 3000);
    </script>
</body>
</html>
